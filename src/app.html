<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#120004">
	<title>Vilan — The Modern Web Language</title>
	<meta name="description" content="Vilan is a language for building full-stack web apps: one small toolchain, reactive UI, and a compiler that checks what you usually find out at runtime.">
	<link rel="icon" href="https://vilan-lang.org/favicon.ico" sizes="48x48">
	<link rel="icon" href="https://vilan-lang.org/assets/icon-192.png" type="image/png" sizes="192x192">
	<link rel="apple-touch-icon" href="https://vilan-lang.org/assets/apple-touch-icon.png">
	<meta property="og:title" content="Vilan — The Modern Web Language">
	<meta property="og:description" content="A language for building full-stack web apps: one small toolchain, reactive UI, and a compiler that checks what you usually find out at runtime.">
	<meta property="og:image" content="https://vilan-lang.org/assets/social_card.png">
	<meta property="og:url" content="https://vilan-lang.org/">
	<meta property="og:type" content="website">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="stylesheet" href="/client.css">
	<style>
		/* Self-hosted webfonts (OFL): Inter is the variable file, one face for
		   every weight; Vilan Display is Raleway 600, subset to latin and
		   renamed — "Raleway" is a Reserved Font Name, and the OFL reserves
		   it for the unmodified font (see assets/fonts/VILAN-DISPLAY-LICENSE.txt). */
		@font-face {
			font-family: "Inter";
			font-style: normal;
			font-weight: 100 900;
			font-display: swap;
			src: url(https://vilan-lang.org/assets/fonts/inter-latin.woff2) format("woff2");
		}
		@font-face {
			font-family: "Vilan Display";
			font-style: normal;
			font-weight: 600;
			font-display: swap;
			src: url(https://vilan-lang.org/assets/fonts/vilan-display-600-latin.woff2) format("woff2");
		}
		html, body { margin: 0; height: 100%; background: #120004; }
		/* Selection inverts the page: ink on blush. */
		::selection { background: #F9DFE7; color: #120004; }
		/* The hero bloom's drift (the wrapper references this by name). Small
		   amplitude on purpose — weather, not motion. */
		@keyframes bloom-drift-a {
			from { transform: translate(0, 0) scale(1); }
			to { transform: translate(0.8%, 1.6%) scale(1.035); }
		}
		/* The diagram's mirror line flows toward its arrow. */
		@keyframes dash-flow {
			to { background-position: 22px 0; }
		}
		/* The editor art's caret. */
		@keyframes caret-blink {
			0%, 49% { opacity: 1; }
			50%, 100% { opacity: 0; }
		}
		@media (prefers-reduced-motion: reduce) {
			* { animation: none !important; }
		}
	</style>
</head>
<body>
	<div id="app"><!--ssr--></div>
	<!-- Figma's Texture effect, from the design export (scale reduced: the export's 200 smears far beyond what Figma renders): fine noise
	     displacing the blurred bloom (the page references it as a CSS filter).
	     Outside #app so the client's render-and-replace never removes it. -->
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<filter id="bloom-texture" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
			<feTurbulence type="fractalNoise" baseFrequency="0.76923" numOctaves="3" seed="3030"/>
			<feDisplacementMap in="SourceGraphic" scale="90" xChannelSelector="R" yChannelSelector="G"/>
		</filter>
	</svg>
	<script type="module" src="/client.js"></script>
</body>
</html>
