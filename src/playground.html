<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- Dark is the default, light follows the OS (theme.vl's token block is
	     redeclared behind prefers-color-scheme: light); the UA is told both so
	     its own chrome - form controls, scrollbars - agrees with the page. -->
	<meta name="color-scheme" content="dark light">
	<meta name="theme-color" content="#120004" media="(prefers-color-scheme: dark)">
	<meta name="theme-color" content="#F9DFE7" media="(prefers-color-scheme: light)">
	<title>Vilan Playground — run vilan in your browser</title>
	<meta name="description" content="Write and run Vilan in your browser: the compiler itself runs client-side as WebAssembly — no install, no server.">
	<link rel="icon" href="https://vilan-lang.org/favicon.ico" sizes="48x48">
	<link rel="icon" href="https://vilan-lang.org/assets/icon-192.png" type="image/png" sizes="192x192">
	<link rel="apple-touch-icon" href="https://vilan-lang.org/assets/apple-touch-icon.png">
	<meta property="og:title" content="Vilan Playground">
	<meta property="og:description" content="Write and run Vilan in your browser: the compiler itself runs client-side as WebAssembly — no install, no server.">
	<meta property="og:image" content="https://vilan-lang.org/assets/social_card.png">
	<meta property="og:url" content="https://vilan-lang.org/playground/">
	<meta property="og:type" content="website">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="stylesheet" href="/playground/playground.css">
	<style>
		/* Self-hosted webfonts (OFL) — the same faces the landing page loads,
		   so navigating between the two costs no new fetches. */
		@font-face {
			font-family: "Inter";
			font-style: normal;
			font-weight: 100 900;
			font-display: swap;
			src: url(https://vilan-lang.org/assets/fonts/inter-latin.woff2) format("woff2");
		}
		@font-face {
			font-family: "Vilan Display";
			font-style: normal;
			font-weight: 600;
			font-display: swap;
			src: url(https://vilan-lang.org/assets/fonts/vilan-display-600-latin.woff2) format("woff2");
		}
		/* The code face, declared here for the same reason as the other two:
		   both shells load the same faces. The editor's own theme moves onto
		   it in slice 2 (K10) — this slice only makes the face available. */
		@font-face {
			font-family: "CommitMonoV143";
			font-style: normal;
			font-weight: 200 700;
			font-display: swap;
			font-synthesis: none;
			src: url(https://vilan-lang.org/assets/fonts/commit-mono-v143.woff2) format("woff2");
		}
		html, body { margin: 0; height: 100%; background: var(--down-dim, #120004); }
		::selection { background: var(--up-bright, #F9DFE7); color: var(--down-dim, #120004); }
		/* The editor host is a plain div until CodeMirror mounts; the widget
		   and the per-Run iframe both fill whatever box the page gives them.
		   #app spans the viewport so the workbench can flex to the fold. */
		#app { height: 100%; }
		#editor .cm-editor { height: 100%; }
		#runner iframe { border: 0; width: 100%; height: 100%; background: #fff; }
		button:focus-visible, select:focus-visible {
			outline: 2px solid var(--primary, #EB682E);
			outline-offset: 2px;
		}
		@media (prefers-reduced-motion: reduce) {
			* { animation: none !important; }
		}
	</style>
</head>
<body>
	<div id="app"><!--ssr--></div>
	<!-- The vendored editor bundle (CodeMirror 6 + the worker and iframe
	     machinery) and the generated example table load as plain scripts, so
	     both globals exist before the module entry below runs. -->
	<script src="/playground/examples.js"></script>
	<script src="/playground/editor.js"></script>
	<script type="module" src="/playground/playground.js"></script>
</body>
</html>
