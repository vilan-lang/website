# Deploy the site to vilan-lang.org. Every push to main (and any manual
# dispatch) rebuilds the package, captures the server-rendered pages, and
# commits the static export - the root set (index.html plus every build
# artifact: client.js, client.css, playground.js, playground.css - the
# server serves each leg's build at /<filename>, `serve_build`'s route
# shape, and the pages repo mirrors it), the playground/ set (the rendered
# page, the vendored editor pieces, and the versioned wasm), the chrome/
# set (the masthead rendered as a fragment plus its stylesheet, which that
# repo's docs.yml folds into the book, and the generated token palette), a
# root .nojekyll and nothing else - to
# vilan-lang/vilan-lang.github.io, whose branch-based Pages build publishes
# main as-is. docs/ there belongs to that repo's docs.yml and assets/ to
# hand deploys, so the commit stages only the allowlisted files.
#
# The toolchain installs from the latest tagged release (v0.17.0 was the
# first with B35, which the feature grid needs), via the official install
# script - the same on-ramp the README teaches, so a broken script fails
# here before a user meets it. No Rust toolchain, no cargo, no cache. The
# installer is downloaded and checksum-verified before it is run, never piped
# into a shell (K20): scripts/install-toolchain.sh, which ci.yml shares.
#
# The playground's compiler (vilan-core as wasm) downloads from the SAME
# release the toolchain installs from - one version lever - and is gated by
# scripts/smoke-playground.mjs before anything ships: every seeded example
# must compile clean against the exact wasm the visitor will get. The pair
# is committed to the pages repo gzipped; unchanged bytes drop out of the
# commit naturally, so it only lands when a release moved it.
#
# The push authenticates as the vilan-site-deploy GitHub App (contents
# read-write, installed on vilan-lang.github.io only): each run mints a
# short-lived installation token from the app id + private key stored here
# as the DEPLOY_APP_ID / DEPLOY_APP_PRIVATE_KEY secrets. Until those exist
# the workflow still builds and renders (a deploy dry run on every push) and
# skips the push with a notice, per the disabled-until-secret-exists
# convention.
#
# Every `uses:` below is pinned to a full commit SHA with its tag in the
# comment (K19, L14's class): a mutable tag is a standing grant of code
# execution to whoever can move it, and this workflow holds a token that can
# write the published site. The playground compiler this job downloads is now
# checksum-verified against the release's own sha256sums.txt before it is
# unpacked - see scripts/fetch-wasm.sh.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install the vilan toolchain
        # Downloaded, checksum-verified, and only then run - never `curl | sh`,
        # which puts nothing between the network and a shell in the one job
        # that holds the site-deploy credentials (K20). The script carries the
        # reasoning and what the check does and does not buy.
        run: |
          sh scripts/install-toolchain.sh
          echo "$HOME/.vilan/bin" >> "$GITHUB_PATH"
          "$HOME/.vilan/bin/vilan" --version
      - name: Fetch the playground compiler
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/fetch-wasm.sh
      - name: Build the site
        run: vilan build .
      - name: Smoke-compile the seeded examples
        run: node scripts/smoke-playground.mjs
      - name: Behaviour harness
        # The site's own bundles, driven under a node DOM stub (scripts/test.mjs).
        # The deploy is not the harness's only gate - ci.yml runs it on every
        # push - but a red harness must not reach vilan-lang.org either.
        run: node scripts/test.mjs --no-build
      - name: Render the pages
        run: |
          mkdir -p export/playground export/chrome
          node dist/server.mjs &
          server=$!
          curl -sS --fail --retry 30 --retry-delay 1 --retry-connrefused \
            http://localhost:3000/ -o export/index.html
          curl -sS --fail http://localhost:3000/playground -o export/playground/index.html
          kill "$server"
          # Rung 2 has no ssr marker to leave behind: `Document::render`
          # splices inside the mount element by construction. The failure
          # mode that remains is a page that shipped UNRENDERED, so that is
          # what the gate checks - an empty mount div means no splice.
          for page in export/index.html export/playground/index.html; do
            if grep -q '<div id="app"></div>' "$page"; then
              echo "::error::$page has an empty mount div - the page did not splice"
              exit 1
            fi
          done
          # The chrome export: the masthead as a fragment (header.html) plus
          # the chrome leg's own stylesheet (header.css), for the book. The
          # fragment lands in an mdBook Handlebars template verbatim, so a
          # stray mustache would break every docs build downstream.
          node dist/chrome.mjs export/chrome
          if grep -q '{{' export/chrome/header.html; then
            echo "::error::export/chrome/header.html contains '{{' - the book's template engine would choke on it"
            exit 1
          fi
          # Every build artifact at the root, where the generated documents
          # and `serve_build` both address them.
          cp dist/client.js dist/client.css dist/playground.js dist/playground.css export/
          cp playground/editor.js playground/examples.js playground/worker.js export/playground/
          # The compiler ships under its versioned, immutable directory; only
          # the tiny manifest moves between releases, so browsers can never
          # hold a mixed glue/wasm pair across a rollover.
          VER="$(cat playground/wasm/VERSION)"
          mkdir -p "export/playground/$VER"
          cp playground/wasm/manifest.json export/playground/
          cp "playground/wasm/$VER/vilan_wasm.js" "playground/wasm/$VER/vilan_wasm_bg.wasm.gz" \
            "export/playground/$VER/"
      - name: Is there an app to push with?
        id: pages
        # A job-level if: cannot read secrets, so the secrets' presence
        # becomes a step output the deploy steps condition on (the same gate
        # as release.yml's publish jobs - the workflow lands green before the
        # app exists and turns into a real deploy the moment it does).
        env:
          DEPLOY_APP_ID: ${{ secrets.DEPLOY_APP_ID }}
          DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$DEPLOY_APP_ID" ] && [ -n "$DEPLOY_APP_PRIVATE_KEY" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site not deployed::DEPLOY_APP_ID / DEPLOY_APP_PRIVATE_KEY are not configured - create a GitHub App with contents read-write installed on vilan-lang.github.io and store its id and private key as these secrets."
          fi
      - name: Mint the pages-repo token
        id: app
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: vilan-lang
          repositories: vilan-lang.github.io
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.pages.outputs.deploy == 'true'
        with:
          repository: vilan-lang/vilan-lang.github.io
          token: ${{ steps.app.outputs.token }}
          path: site
      - name: Commit if the site changed
        if: steps.pages.outputs.deploy == 'true'
        run: |
          cp export/index.html export/client.js export/client.css \
             export/playground.js export/playground.css site/
          mkdir -p site/chrome
          # tokens-fixture.css stays out on purpose: it is a repo artifact
          # (committed in the toolchain repo beside the book), not a served one.
          cp export/chrome/header.html export/chrome/header.css \
             export/chrome/tokens.css site/chrome/
          VER="$(cat playground/wasm/VERSION)"
          mkdir -p "site/playground/$VER"
          cp export/playground/index.html export/playground/editor.js \
             export/playground/examples.js export/playground/worker.js \
             export/playground/manifest.json \
             site/playground/
          cp "export/playground/$VER/vilan_wasm.js" \
             "export/playground/$VER/vilan_wasm_bg.wasm.gz" "site/playground/$VER/"
          # K11 retention (RULED 2026-08-20): the playground keeps the newest
          # 6 version directories; git history keeps the rest, and shared
          # links carry no version pin - docs-port.md 2.4: the docs' run
          # buttons emit no &v=, so only the manifest's current entry is
          # load-bearing. The current release is held out of the candidate
          # list, so it survives regardless of sort quirks; with 6 or fewer
          # directories the tail is empty and nothing is pruned. The prune
          # runs before the manifest is built, so the manifest below reflects
          # exactly the surviving directories.
          for stale in $(ls -d site/playground/v*/ | xargs -n1 basename \
              | sort -rV | grep -Fxv "$VER" | tail -n +6); do
            git -C site rm -qr "playground/$stale"
          done
          # The manifest's inventory is the pages repo itself: the surviving
          # version directories, current first then descending - the version
          # selector's option list.
          versions="\"$VER\""
          for name in $(ls -d site/playground/v*/ | xargs -n1 basename | sort -rV); do
            [ "$name" = "$VER" ] && continue
            versions="$versions,\"$name\""
          done
          printf '{"compiler":"%s","versions":[%s]}' "$VER" "$versions" > site/playground/manifest.json
          # The root was Jekyll-processed until the playground arrived; docs/
          # already carries its own .nojekyll.
          touch site/.nojekyll
          cd site
          # The pre-versioning flat pair is dead weight once the versioned
          # layout lands, and the playground bundle pair moved to the root
          # when the site climbed to rung 2 (the generated document addresses
          # /playground.js, serve_build's route shape); each rm is a no-op on
          # every deploy after its first.
          git rm -q --ignore-unmatch playground/vilan_wasm.js playground/vilan_wasm_bg.wasm.gz \
            playground/playground.js playground/playground.css
          git add index.html client.js client.css playground.js playground.css .nojekyll \
            chrome/header.html chrome/header.css chrome/tokens.css \
            playground/index.html \
            playground/editor.js playground/examples.js playground/worker.js \
            playground/manifest.json \
            "playground/$VER/vilan_wasm.js" "playground/$VER/vilan_wasm_bg.wasm.gz"
          if git diff --cached --quiet; then
            echo "::notice::the site is unchanged"
            exit 0
          fi
          git -c user.name="vilan-site-deploy[bot]" \
              -c user.email="310328521+vilan-site-deploy[bot]@users.noreply.github.com" \
            commit -m "site: deploy vilan-lang/website@${GITHUB_SHA::7}"
          # The rebase fallback needs the identity too: a concurrent docs
          # publish can win the push race, and a rebase with no committer
          # identity dies where the plain push would have retried fine.
          git push || (git -c user.name="vilan-site-deploy[bot]" \
              -c user.email="310328521+vilan-site-deploy[bot]@users.noreply.github.com" \
            pull --rebase && git push)
