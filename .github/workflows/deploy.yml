# Deploy the site to vilan-lang.org. Every push to main (and any manual
# dispatch) rebuilds the package, captures the server-rendered page, and
# commits the static export - index.html, client.js, client.css and nothing
# else - to vilan-lang/vilan-lang.github.io, whose branch-based Pages build
# publishes main as-is. docs/ there belongs to that repo's docs.yml and
# assets/ to hand deploys, so the commit stages only the three site files.
#
# The toolchain installs from the latest tagged release (v0.17.0 was the
# first with B35, which the feature grid needs), via the official install
# script - the same on-ramp the README teaches, so a broken script fails
# here before a user meets it. No Rust toolchain, no cargo, no cache.
#
# The push authenticates as the vilan-site-deploy GitHub App (contents
# read-write, installed on vilan-lang.github.io only): each run mints a
# short-lived installation token from the app id + private key stored here
# as the DEPLOY_APP_ID / DEPLOY_APP_PRIVATE_KEY secrets. Until those exist
# the workflow still builds and renders (a deploy dry run on every push) and
# skips the push with a notice, per the disabled-until-secret-exists
# convention.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the vilan toolchain
        run: |
          curl -fsSL https://github.com/vilan-lang/vilan/releases/latest/download/install.sh | sh
          echo "$HOME/.vilan/bin" >> "$GITHUB_PATH"
          "$HOME/.vilan/bin/vilan" --version
      - name: Build the site
        run: vilan build .
      - name: Render the page
        run: |
          mkdir export
          node dist/server.js &
          server=$!
          curl -sS --fail --retry 30 --retry-delay 1 --retry-connrefused \
            http://localhost:3000/ -o export/index.html
          kill "$server"
          if grep -q '<!--ssr-->' export/index.html; then
            echo "::error::the render still contains the ssr marker - the page did not splice"
            exit 1
          fi
          cp dist/client.js dist/client.css export/
      - name: Is there an app to push with?
        id: pages
        # A job-level if: cannot read secrets, so the secrets' presence
        # becomes a step output the deploy steps condition on (the same gate
        # as release.yml's publish jobs - the workflow lands green before the
        # app exists and turns into a real deploy the moment it does).
        env:
          DEPLOY_APP_ID: ${{ secrets.DEPLOY_APP_ID }}
          DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$DEPLOY_APP_ID" ] && [ -n "$DEPLOY_APP_PRIVATE_KEY" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site not deployed::DEPLOY_APP_ID / DEPLOY_APP_PRIVATE_KEY are not configured - create a GitHub App with contents read-write installed on vilan-lang.github.io and store its id and private key as these secrets."
          fi
      - name: Mint the pages-repo token
        id: app
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: vilan-lang
          repositories: vilan-lang.github.io
      - uses: actions/checkout@v4
        if: steps.pages.outputs.deploy == 'true'
        with:
          repository: vilan-lang/vilan-lang.github.io
          token: ${{ steps.app.outputs.token }}
          path: site
      - name: Commit if the site changed
        if: steps.pages.outputs.deploy == 'true'
        run: |
          cp export/index.html export/client.js export/client.css site/
          cd site
          git add index.html client.js client.css
          if git diff --cached --quiet; then
            echo "::notice::the site is unchanged"
            exit 0
          fi
          git -c user.name="vilan-site-deploy[bot]" \
              -c user.email="310328521+vilan-site-deploy[bot]@users.noreply.github.com" \
            commit -m "site: deploy vilan-lang/website@${GITHUB_SHA::7}"
          git push || (git pull --rebase && git push)
