# The site's behaviour gate, on every push and pull request.
#
# Until this existed the repo had no test CI at all - only deploy.yml, which
# runs on `main` alone and whose failure mode is a site already half-shipped.
# A defect in the site's own vilan code therefore had nowhere to be caught, and
# nowhere to be PINNED: tracker K18 is the item that named that gap, and
# scripts/test.mjs plus tests/ is the answer. This workflow is what makes the
# answer load-bearing on a branch, before a merge, rather than at deploy time.
#
# The harness drives the site's own bundles (dist/*.js) under a node DOM stub,
# and tests/examples.test.mjs compiles and runs every program the site ships -
# the playground's seeded examples and the landing page's code panels - on the
# native toolchain. The playground's wasm compiler is fetched too (K25), from
# the same latest release the toolchain installs from, so the smoke test the
# deploy runs (scripts/smoke-playground.mjs: the same programs, compiled by the
# exact compiler a visitor gets, under its mode's prelude - the web set in the
# browser, the base set in the server check) is red on the branch that rots
# an example rather than on the push to main that would deploy it.
#
# Every `uses:` is pinned to a full commit SHA with its tag in the comment,
# the same rule deploy.yml states (K19, L14's class).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the vilan toolchain
        # The verified installer, shared with deploy.yml (K20).
        run: |
          sh scripts/install-toolchain.sh
          echo "$HOME/.vilan/bin" >> "$GITHUB_PATH"
          "$HOME/.vilan/bin/vilan" --version
      - name: Build and run the harness
        run: node scripts/test.mjs
      - name: Fetch the playground compiler
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/fetch-wasm.sh
      - name: Smoke-compile the shipped programs in the playground's compiler
        run: node scripts/smoke-playground.mjs
