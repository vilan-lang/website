# The vilan promo website — built with vilan itself.
#
# One package, three entries: the client and the server both build the one
# `fun page(): View` in `src/page.vl`, and the playground builds its own.
# `std::ui` resolves per entry platform — live DOM in the browser builds, an
# HTML string tree in the server build — so the server renders each page to
# markup for first paint and the browser rebuilds it live and replaces on boot.
#
#   vilan run .            build everything and serve http://localhost:3000/
#   vilan run . --watch    the dev loop (rebuild + HMR on save)
[package]
name = "website"
description = "The vilan promo site (vilan-lang.org), a fullstack SSR vilan package"

[entry.client]
target = "browser"

[entry.playground]
# The /playground page's own bundle: the landing page never pays for the
# editor, the worker wiring, or the compile machinery.
target = "browser"

[entry.server]
# target defaults to node; path defaults to src/server.vl
